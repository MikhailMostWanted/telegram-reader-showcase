name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q telegram_reader
      - run: bash -n scripts/build.sh scripts/update.sh
      - run: docker compose config --quiet
      - run: docker build -t telegram-reader-mcp:ci .
