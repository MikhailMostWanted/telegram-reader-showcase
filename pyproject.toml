[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-reader-mcp"
version = "0.1.0"
description = "Private, on-demand, read-only Telegram MCP server"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastmcp-slim[server]==4.0.11",
  "Telethon==1.45.0",
  "pypdf>=6,<7",
  "defusedxml>=0.7,<1",
  "openpyxl>=3.1,<4",
  "xlrd>=2,<3",
  "python-socks[asyncio]>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "fastmcp-slim[client]==4.0.11"]

[project.scripts]
telegram-reader = "telegram_reader.__main__:main"

[tool.setuptools.packages.find]
include = ["telegram_reader*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
